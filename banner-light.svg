<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    @keyframes glow {
        0% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.5)); }
        50% { filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.9)); }
        100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.5)); }
    }
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }
    @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
    }
    @keyframes slide-in {
        from { transform: translateX(-50px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
    }
    @keyframes blink {
        50% { border-color: transparent; }
    }

    .bg { fill: #07090F; }
    .grid { stroke: rgba(0, 242, 254, 0.1); stroke-width: 1.5; }
    
    /* Glassmorphism Card */
    .glass-card {
        fill: rgba(25, 30, 45, 0.6);
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 2;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    .glass-highlight {
        fill: url(#glass-gradient);
    }

    .title {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 2px;
    }
    
    .subtitle {
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        fill: #00f2fe;
        font-weight: bold;
    }

    .neon-text {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        fill: #a2a8d3;
        letter-spacing: 4px;
        text-transform: uppercase;
    }
    
    .tech-pill {
        fill: rgba(0, 242, 254, 0.1);
        stroke: #00f2fe;
        stroke-width: 1.5;
        rx: 15;
    }
    
    .tech-pill-text {
        font-family: 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        fill: #00f2fe;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .typewriter {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 3px solid #00f2fe;
        animation: typing 3s steps(40, end), blink .75s step-end infinite;
        width: 100%;
    }
</style>

<defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
        <stop offset="0%" stop-color="rgba(0, 242, 254, 0.15)" />
        <stop offset="100%" stop-color="rgba(7, 9, 15, 1)" />
    </radialGradient>
    
    <!-- Glass Highlight Gradient -->
    <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
        <stop offset="40%" stop-color="rgba(255, 255, 255, 0.0)" />
        <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f2fe" />
        <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#bc13fe" />
        <stop offset="100%" stop-color="#7a00ff" />
    </linearGradient>

    <!-- Hexagon Pattern -->
    <pattern id="hex-pattern" x="0" y="0" width="60" height="103.923" patternUnits="userSpaceOnUse">
        <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
        <path d="M30 103.923 L60 86.6 L60 51.96 L30 69.28 L0 51.96 L0 86.6 Z" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>
</defs>

<!-- Background Base -->
<rect width="1280" height="400" class="bg" />
<!-- Glowing Core -->
<rect width="1280" height="400" fill="url(#bg-glow)" />
<!-- Grid -->
<rect width="1280" height="400" fill="url(#grid)" />
<!-- Hex Pattern -->
<rect width="1280" height="400" fill="url(#hex-pattern)" />

<!-- Sci-Fi HUD Elements (Background) -->
<g stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" fill="none">
    <circle cx="150" cy="200" r="100" stroke-dasharray="2 10" />
    <circle cx="150" cy="200" r="80" stroke-dasharray="20 10 5 10" />
    <circle cx="1130" cy="200" r="120" stroke-dasharray="1 5" />
    <circle cx="1130" cy="200" r="90" stroke-dasharray="15 15" stroke="rgba(188, 19, 254, 0.3)" />
    
    <path d="M 0 50 L 100 50 L 120 70 L 300 70" stroke-dasharray="5 5" />
    <path d="M 1280 350 L 1180 350 L 1160 330 L 980 330" stroke-dasharray="5 5" stroke="rgba(188, 19, 254, 0.5)"/>
</g>

<!-- Main Glassmorphism Panel (Animated Float) -->
<g style="animation: float 6s ease-in-out infinite;">
    <!-- Glass Background -->
    <rect x="240" y="60" width="800" height="280" rx="20" class="glass-card" />
    
    <!-- Glass Highlight -->
    <rect x="240" y="60" width="800" height="280" rx="20" class="glass-highlight" />
    
    <!-- Decorative Lines on Glass -->
    <path d="M 240 100 L 260 100 L 280 120 L 280 300" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />
    <path d="M 1040 300 L 1020 300 L 1000 280 L 1000 100" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none" />
    
    <!-- Neon Accent Bars -->
    <rect x="240" y="120" width="4" height="60" fill="url(#neon-cyan)" style="animation: glow 3s infinite;" />
    <rect x="1036" y="220" width="4" height="60" fill="url(#neon-purple)" style="animation: glow 3s infinite; animation-delay: 1.5s;" />

    <!-- Content -->
    <g style="animation: slide-in 1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;">
        <!-- Top Title (SYSTEM INIT) -->
        <text x="640" y="110" text-anchor="middle" class="neon-text">/// SYSTEM ALIVE /// DEVELOPER PROFILE</text>
        
        <!-- Main Name -->
        <text x="640" y="190" text-anchor="middle" class="title">KISHOREKUMAR V</text>
        
        <!-- Typewriter Subtitle -->
        <foreignObject x="340" y="220" width="600" height="40">
            <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; text-align: center;">
                <div class="subtitle typewriter" style="display: inline-block; text-align: center;">
                    > Full Stack Web &amp; Mobile Developer_
                </div>
            </div>
        </foreignObject>

        <!-- Tech Stack Pills -->
        <g transform="translate(365, 290)">
            <!-- React -->
            <g transform="translate(0, 0)">
                <rect width="80" height="30" class="tech-pill" />
                <text x="40" y="20" text-anchor="middle" class="tech-pill-text">REACT</text>
            </g>
            <!-- Node.js -->
            <g transform="translate(95, 0)">
                <rect width="95" height="30" class="tech-pill" stroke="rgba(188, 19, 254, 0.8)" fill="rgba(188, 19, 254, 0.1)" />
                <text x="47.5" y="20" text-anchor="middle" class="tech-pill-text" fill="#bc13fe">NODE.JS</text>
            </g>
            <!-- Flutter -->
            <g transform="translate(205, 0)">
                <rect width="90" height="30" class="tech-pill" />
                <text x="45" y="20" text-anchor="middle" class="tech-pill-text">FLUTTER</text>
            </g>
            <!-- MongoDB -->
            <g transform="translate(310, 0)">
                <rect width="100" height="30" class="tech-pill" stroke="rgba(188, 19, 254, 0.8)" fill="rgba(188, 19, 254, 0.1)" />
                <text x="50" y="20" text-anchor="middle" class="tech-pill-text" fill="#bc13fe">MONGODB</text>
            </g>
            <!-- Firebase -->
            <g transform="translate(425, 0)">
                <rect width="100" height="30" class="tech-pill" />
                <text x="50" y="20" text-anchor="middle" class="tech-pill-text">FIREBASE</text>
            </g>
        </g>
    </g>
</g>

<!-- Floating Particles -->
<circle cx="200" cy="150" r="3" fill="#00f2fe" style="animation: float 4s ease-in-out infinite, glow 2s infinite;" />
<circle cx="1080" cy="100" r="2" fill="#bc13fe" style="animation: float 5s ease-in-out infinite 1s, glow 3s infinite;" />
<circle cx="250" cy="320" r="4" fill="#00f2fe" style="animation: float 6s ease-in-out infinite 2s, glow 2s infinite;" />
<circle cx="950" cy="280" r="2.5" fill="#bc13fe" style="animation: float 4.5s ease-in-out infinite 0.5s, glow 2.5s infinite;" />

<!-- Glowing Pulse Rings -->
<circle cx="150" cy="200" r="40" fill="none" stroke="#00f2fe" stroke-width="1" style="animation: pulse-ring 3s infinite;" />
<circle cx="1130" cy="200" r="50" fill="none" stroke="#bc13fe" stroke-width="1" style="animation: pulse-ring 4s infinite 1s;" />

</svg>