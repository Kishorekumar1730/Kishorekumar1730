<svg width="1280" height="740" viewBox="0 0 1280 740" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F2F2F7" />
        <stop offset="50%" stop-color="#FAFAFF" />
        <stop offset="100%" stop-color="#E5E5EA" />
    </linearGradient>

    <!-- Glowing Orbs Gradients (Light Mode) -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFB3D9" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#FFB3D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#B3F0FF" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#B3F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D9B3FF" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#D9B3FF" stop-opacity="0" />
    </radialGradient>

    <!-- Text Shadow Filter -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.05)" />
    </filter>
</defs>

<style>
    .orb { animation: float 15s infinite ease-in-out alternate; }
    .orb2 { animation: float2 20s infinite ease-in-out alternate; }
    .orb3 { animation: float3 18s infinite ease-in-out alternate; }
    .glass-card { 
        fill: rgba(255, 255, 255, 0.6); 
        stroke: rgba(255, 255, 255, 1); 
        stroke-width: 2; 
    }
    .title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 76px;
        font-weight: 800;
        fill: #1C1C1E;
        letter-spacing: -2px;
    }
    .subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 400;
        fill: #8E8E93;
        letter-spacing: 4px;
        text-transform: uppercase;
    }
    @keyframes float {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(150px, -100px) scale(1.2); }
    }
    @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        100% { transform: translate(-200px, 150px) scale(0.9); }
    }
    @keyframes float3 {
        0% { transform: translate(0px, 0px) scale(0.9); }
        100% { transform: translate(100px, 200px) scale(1.3); }
    }
    .tech-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 16px;
        fill: #8E8E93;
        font-weight: 600;
        letter-spacing: 6px;
    }
    .grid {
        stroke: rgba(0,0,0,0.02);
        stroke-width: 1;
    }
</style>

<!-- Background -->
<rect width="1280" height="740" fill="url(#bgGrad)" />

<!-- Background Grid -->
<pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
</pattern>
<rect width="1280" height="740" fill="url(#gridPattern)" />

<!-- Animated Orbs -->
<circle cx="200" cy="600" r="400" fill="url(#orb1)" class="orb" />
<circle cx="1000" cy="200" r="500" fill="url(#orb2)" class="orb2" />
<circle cx="640" cy="800" r="450" fill="url(#orb3)" class="orb3" />

<!-- Glass Container -->
<g transform="translate(140, 170)">
    <!-- Simulated drop shadow for glass -->
    <rect width="1000" height="400" rx="40" fill="rgba(0,0,0,0.08)" filter="blur(25px)" transform="translate(0, 30)" />
    
    <!-- Glass body -->
    <rect width="1000" height="400" rx="40" class="glass-card" />
    
    <!-- Text Content -->
    <text x="500" y="170" text-anchor="middle" class="title" filter="url(#textShadow)">KISHOREKUMAR V</text>
    <text x="500" y="240" text-anchor="middle" class="subtitle">Full Stack Developer</text>
    
    <!-- Geometric Accents inside card -->
    <line x1="200" y1="310" x2="800" y2="310" stroke="rgba(0,0,0,0.1)" stroke-width="2" />
    <circle cx="500" cy="310" r="6" fill="#00C7FF" />
    
    <g transform="translate(290, 345)">
        <text x="0" y="0" class="tech-text">REACT</text>
        <circle cx="100" cy="-5" r="3" fill="#FF2A85" />
        <text x="135" y="0" class="tech-text">NODE.JS</text>
        <circle cx="250" cy="-5" r="3" fill="#8E44AD" />
        <text x="285" y="0" class="tech-text">FLUTTER</text>
    </g>
</g>

<!-- Corner Decorative Elements -->
<path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="3" />
<path d="M 1230 100 L 1230 50 L 1180 50" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="3" />
<path d="M 50 640 L 50 690 L 100 690" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="3" />
<path d="M 1230 640 L 1230 690 L 1180 690" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="3" />
</svg>