<svg width="820" height="180" viewBox="0 0 820 180" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shine { 0% { transform: translateX(-100%) skewX(-45deg); } 100% { transform: translateX(200%) skewX(-45deg); } }
    .bg { fill: #111; stroke: #333; stroke-width: 2; rx: 12; }
    .trophy-cell { fill: #1a1a24; stroke: #ff00ff; stroke-width: 1; rx: 8; opacity: 0; animation: popIn 0.5s ease-out forwards; }
    .text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; fill: #eee; }
    .title { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .sub { font-size: 12px; fill: #aaa; text-anchor: middle; }
    .holo { fill: url(#holoGrad); animation: shine 3s infinite; mix-blend-mode: overlay; }
</style>
<defs>
    <linearGradient id="holoGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="50%" stop-color="#fff"/>
        <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
</defs>
<rect width="820" height="180" class="bg" />

<g transform="translate(20, 20)">
    <!-- Trophy 1 -->
    <g transform="translate(0, 0)" style="animation-delay: 0.1s;">
        <rect width="180" height="140" class="trophy-cell" />
        <rect width="180" height="140" class="holo" />
        <text x="90" y="40" font-size="30" text-anchor="middle">🏆</text>
        <text x="90" y="80" class="text title" fill="#ffbd2e">Pull Shark</text>
        <text x="90" y="105" class="text sub">Merged 100+ PRs</text>
    </g>
    <!-- Trophy 2 -->
    <g transform="translate(200, 0)" style="animation-delay: 0.3s;">
        <rect width="180" height="140" class="trophy-cell" />
        <rect width="180" height="140" class="holo" />
        <text x="90" y="40" font-size="30" text-anchor="middle">🌟</text>
        <text x="90" y="80" class="text title" fill="#00ffcc">Star Struck</text>
        <text x="90" y="105" class="text sub">Earned 100+ Stars</text>
    </g>
    <!-- Trophy 3 -->
    <g transform="translate(400, 0)" style="animation-delay: 0.5s;">
        <rect width="180" height="140" class="trophy-cell" />
        <rect width="180" height="140" class="holo" />
        <text x="90" y="40" font-size="30" text-anchor="middle">🚀</text>
        <text x="90" y="80" class="text title" fill="#ff00ff">Galaxy Brain</text>
        <text x="90" y="105" class="text sub">20+ Discussions</text>
    </g>
    <!-- Trophy 4 -->
    <g transform="translate(600, 0)" style="animation-delay: 0.7s;">
        <rect width="180" height="140" class="trophy-cell" />
        <rect width="180" height="140" class="holo" />
        <text x="90" y="40" font-size="30" text-anchor="middle">🥇</text>
        <text x="90" y="80" class="text title" fill="#f1e05a">Golden Commit</text>
        <text x="90" y="105" class="text sub">Code God</text>
    </g>
</g>
</svg>