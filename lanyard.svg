<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- Holographic Gradient -->
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF007F" stop-opacity="0.3" />
        <stop offset="30%" stop-color="#7000FF" stop-opacity="0.2" />
        <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#FF00FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#A0A0B0" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#12121A" />
        <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#00F0FF" flood-opacity="0.15" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>

<style>
    .card-container {
        animation: floatCard 6s ease-in-out infinite alternate;
        transform-origin: center top;
    }
    @keyframes floatCard {
        0% { transform: translateY(0px) rotate(-1deg); }
        100% { transform: translateY(15px) rotate(1deg); }
    }
    .sweep {
        animation: shine 4s linear infinite;
    }
    @keyframes shine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
    }
    .text-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #FFF;
        letter-spacing: 1px;
    }
    .text-subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #00F0FF;
        letter-spacing: 2px;
    }
    .text-id {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        fill: #A0A0B0;
    }
    .chip { fill: #D4AF37; }
</style>

<!-- Lanyard String -->
<path d="M 200 -50 C 200 50, 150 100, 200 130" stroke="#333" stroke-width="6" fill="none" />
<path d="M 200 -50 C 200 50, 250 100, 200 130" stroke="#444" stroke-width="6" fill="none" />

<!-- Card Clip Path -->
<clipPath id="cardClip">
    <rect x="50" y="130" width="300" height="430" rx="20" />
</clipPath>

<!-- Holographic Card Group -->
<g class="card-container" filter="url(#shadow)">
    <!-- Base card -->
    <rect x="50" y="130" width="300" height="430" rx="20" fill="url(#cardBg)" stroke="url(#metal)" stroke-width="2" />
    
    <!-- Lanyard Hole -->
    <rect x="150" y="145" width="100" height="15" rx="7.5" fill="#000" stroke="url(#metal)" stroke-width="1" />
    
    <g clip-path="url(#cardClip)">
        <!-- Holographic Base -->
        <rect x="50" y="130" width="300" height="430" fill="url(#holo)" />
        
        <!-- Animated Shine effect -->
        <g class="sweep">
            <polygon points="50,130 150,130 50,560 -50,560" fill="rgba(255,255,255,0.05)" />
        </g>
        
        <!-- Smart Chip -->
        <g transform="translate(80, 200)">
            <rect width="40" height="30" rx="4" class="chip" />
            <path d="M 10 0 L 10 30 M 20 0 L 20 30 M 30 0 L 30 30" stroke="#B8860B" stroke-width="1" />
            <path d="M 0 15 L 40 15" stroke="#B8860B" stroke-width="1" />
        </g>
        
        <!-- NFC Icon -->
        <path d="M 280 205 Q 290 200 300 205 M 285 212 Q 290 208 295 212 M 282 198 Q 290 192 298 198" fill="none" stroke="#A0A0B0" stroke-width="2" stroke-linecap="round" />

        <!-- Profile Picture Placeholder / Graphic -->
        <rect x="100" y="260" width="200" height="150" rx="15" fill="#1A1A24" stroke="rgba(0,240,255,0.3)" stroke-width="1" filter="url(#glow)" />
        <!-- Abstract Cyber Geometric Art in place of a photo -->
        <circle cx="200" cy="335" r="40" fill="none" stroke="#7000FF" stroke-width="4" opacity="0.8" />
        <polygon points="200,305 230,355 170,355" fill="#FF007F" opacity="0.6" />
        <circle cx="200" cy="335" r="10" fill="#00F0FF" />

        <!-- User Info -->
        <text x="200" y="450" text-anchor="middle" class="text-title">KISHOREKUMAR V</text>
        <text x="200" y="475" text-anchor="middle" class="text-subtitle">DEV_ID // FULL STACK</text>
        
        <!-- ID Barcode -->
        <g transform="translate(80, 500)">
            <rect x="0" y="0" width="4" height="30" fill="#FFF" />
            <rect x="8" y="0" width="2" height="30" fill="#FFF" />
            <rect x="14" y="0" width="6" height="30" fill="#FFF" />
            <rect x="24" y="0" width="2" height="30" fill="#FFF" />
            <rect x="30" y="0" width="8" height="30" fill="#FFF" />
            <rect x="42" y="0" width="4" height="30" fill="#FFF" />
            <rect x="50" y="0" width="2" height="30" fill="#FFF" />
            <rect x="56" y="0" width="10" height="30" fill="#FFF" />
            <rect x="70" y="0" width="4" height="30" fill="#FFF" />
            <rect x="78" y="0" width="8" height="30" fill="#FFF" />
            <rect x="90" y="0" width="2" height="30" fill="#FFF" />
            <rect x="96" y="0" width="6" height="30" fill="#FFF" />
            <rect x="106" y="0" width="4" height="30" fill="#FFF" />
            <rect x="114" y="0" width="2" height="30" fill="#FFF" />
            <rect x="120" y="0" width="8" height="30" fill="#FFF" />
            <rect x="132" y="0" width="4" height="30" fill="#FFF" />
            <rect x="140" y="0" width="2" height="30" fill="#FFF" />
            <rect x="146" y="0" width="10" height="30" fill="#FFF" />
            
            <text x="78" y="45" text-anchor="middle" class="text-id">0xKISHORE_1730</text>
        </g>
    </g>
</g>
</svg>