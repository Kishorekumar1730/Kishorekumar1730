<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    @keyframes swing {
        0% { transform: rotate(10deg); }
        20% { transform: rotate(-8deg); }
        40% { transform: rotate(5deg); }
        60% { transform: rotate(-3deg); }
        80% { transform: rotate(1deg); }
        100% { transform: rotate(0deg); }
    }
    @keyframes shine {
        0% { transform: translateX(-150%) skewX(-45deg); }
        100% { transform: translateX(200%) skewX(-45deg); }
    }
    @keyframes pulse {
        0% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
        100% { opacity: 0.7; }
    }
    
    .lanyard { 
        animation: swing 4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; 
        transform-origin: top center; 
    }
    
    /* Cyber/Glass Card Base */
    .card-bg { 
        fill: rgba(11, 12, 16, 0.8); 
        stroke: rgba(0, 242, 254, 0.3); 
        stroke-width: 2; 
        rx: 15; 
        backdrop-filter: blur(10px);
    }
    
    .glass-highlight {
        fill: url(#glassGrad);
    }
    
    /* Holographic shine */
    .holo { 
        fill: url(#holoGrad); 
        opacity: 0.2; 
        animation: shine 6s infinite ease-in-out; 
    }
    
    /* Text Styles */
    .text-title { 
        font-family: 'Segoe UI', Roboto, sans-serif; 
        font-weight: 800; 
        font-size: 24px; 
        fill: #fff; 
        letter-spacing: 2px;
    }
    .text-role { 
        font-family: 'Courier New', monospace; 
        font-size: 15px; 
        fill: #00f2fe; 
        font-weight: bold;
    }
    .text-code { 
        font-family: 'Courier New', monospace; 
        font-size: 12px; 
        fill: #bc13fe; 
    }
    .text-tiny {
        font-family: 'Courier New', monospace; 
        font-size: 10px; 
        fill: #666; 
    }
    
    /* Glowing accents */
    .glow-cyan { stroke: #00f2fe; animation: pulse 3s infinite; }
    .glow-purple { stroke: #bc13fe; animation: pulse 4s infinite 1s; }
</style>

<defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)"/>
        <stop offset="50%" stop-color="rgba(255, 255, 255, 0)"/>
        <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <linearGradient id="holoGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="transparent"/>
        <stop offset="50%" stop-color="#00f2fe"/>
        <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    
    <clipPath id="avatarClip">
        <!-- Hexagon clip path for futuristic look -->
        <path d="M 200 160 L 260 195 L 260 265 L 200 300 L 140 265 L 140 195 Z" />
    </clipPath>
    
    <clipPath id="cardClip">
        <rect x="50" y="100" width="300" height="450" rx="15" />
    </clipPath>

    <!-- Grid pattern for card background -->
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>
</defs>

<g class="lanyard">
    <!-- Strap (High tech cables) -->
    <path d="M 175 0 L 175 80 M 225 0 L 225 80" stroke="#1F2833" stroke-width="10" />
    <path d="M 185 0 L 185 80" stroke="#00f2fe" stroke-width="2" stroke-dasharray="5 5" />
    <path d="M 215 0 L 215 80" stroke="#bc13fe" stroke-width="2" />
    <path d="M 200 0 L 200 80" stroke="#444" stroke-width="4" />
    
    <!-- Clasp (Cybernetic) -->
    <path d="M 170 70 L 230 70 L 225 95 L 175 95 Z" fill="#1F2833" stroke="#00f2fe" stroke-width="2" />
    <circle cx="200" cy="82" r="5" fill="#bc13fe" />
    <circle cx="200" cy="115" r="15" fill="none" stroke="#666" stroke-width="4" />
    
    <!-- Card Container -->
    <g clip-path="url(#cardClip)">
        <!-- Base Glass Card -->
        <rect x="50" y="100" width="300" height="450" class="card-bg" />
        <rect x="50" y="100" width="300" height="450" fill="url(#cardGrid)" />
        <rect x="50" y="100" width="300" height="450" class="glass-highlight" />
        
        <!-- Holographic overlay -->
        <rect x="50" y="100" width="300" height="450" class="holo" />
        
        <!-- Top Tech Bar -->
        <rect x="50" y="100" width="300" height="30" fill="rgba(0, 242, 254, 0.1)" />
        <path d="M 50 130 L 350 130" stroke="#00f2fe" stroke-width="1" />
        <text x="65" y="120" class="text-tiny" fill="#00f2fe">ID:// DEV-404</text>
        <text x="285" y="120" class="text-tiny" fill="#bc13fe">AUTH: CLEAR</text>
        <circle cx="330" cy="115" r="3" fill="#00f2fe" class="glow-cyan" />
        
        <!-- Hexagon Avatar Frame -->
        <!-- Image placeholder - using github avatar -->
        <image href="https://avatars.githubusercontent.com/Kishorekumar1730" x="140" y="160" width="120" height="140" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />
        
        <!-- Avatar Border / Tech details -->
        <path d="M 200 160 L 260 195 L 260 265 L 200 300 L 140 265 L 140 195 Z" fill="none" stroke="#00f2fe" stroke-width="3" class="glow-cyan" />
        <path d="M 200 152 L 265 190 L 265 270 L 200 308 L 135 270 L 135 190 Z" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="10 5" />
        
        <!-- Identification Lines -->
        <text x="200" y="340" text-anchor="middle" class="text-title">KISHOREKUMAR V</text>
        <text x="200" y="365" text-anchor="middle" class="text-role">FULL STACK DEV</text>
        
        <!-- Stats / Data Bars -->
        <g transform="translate(80, 400)">
            <text x="0" y="10" class="text-tiny">SYS.INTEGRATION</text>
            <rect x="0" y="15" width="240" height="4" fill="rgba(255,255,255,0.1)" rx="2" />
            <rect x="0" y="15" width="200" height="4" fill="#00f2fe" rx="2" />
            
            <text x="0" y="35" class="text-tiny">UI/UX.ARCHITECTURE</text>
            <rect x="0" y="40" width="240" height="4" fill="rgba(255,255,255,0.1)" rx="2" />
            <rect x="0" y="40" width="215" height="4" fill="#bc13fe" rx="2" />
            
            <text x="0" y="60" class="text-tiny">BACKEND.CORE</text>
            <rect x="0" y="65" width="240" height="4" fill="rgba(255,255,255,0.1)" rx="2" />
            <rect x="0" y="65" width="180" height="4" fill="#00f2fe" rx="2" />
        </g>
        
        <!-- Bottom Data Strip -->
        <path d="M 70 500 L 100 500 L 110 520 L 330 520" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" fill="none" />
        <rect x="70" y="495" width="20" height="10" fill="#00f2fe" class="glow-cyan" />
        <rect x="95" y="495" width="5" height="10" fill="#bc13fe" />
        
        <!-- Barcode / Matrix area -->
        <g transform="translate(180, 505)">
            <rect x="0" y="0" width="3" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="5" y="0" width="5" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="12" y="0" width="2" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="16" y="0" width="6" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="24" y="0" width="4" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="30" y="0" width="1" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="33" y="0" width="8" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="43" y="0" width="3" height="25" fill="rgba(255,255,255,0.7)" />
            <rect x="48" y="0" width="5" height="25" fill="rgba(255,255,255,0.7)" />
            <text x="25" y="35" text-anchor="middle" class="text-tiny">7 4839 2038 1</text>
        </g>
        
        <!-- Security Chip -->
        <rect x="80" y="505" width="30" height="20" rx="3" fill="#ffd700" opacity="0.8" />
        <path d="M 85 505 L 85 525 M 95 505 L 95 525 M 105 505 L 105 525 M 80 515 L 110 515" stroke="#b8860b" stroke-width="1" />
        
    </g>
</g>
</svg>