<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 210" width="495" height="210">
  <defs>
    <linearGradient id="lg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="100%" stop-color="#161129"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');
    .lg-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
    .lg-name { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .lg-pct { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; fill: #a0aec0; }
  </style>
  <rect width="495" height="210" rx="14" fill="url(#lg-bg)" stroke="#7209b7" stroke-width="1.5"/>
  <text x="25" y="35" class="lg-title">🚀 Most Used Languages &amp; Frameworks</text>
  <g transform="translate(25, 55)">
    <g transform="translate(0, 0)">
      <text x="0" y="14" class="lg-name">🟨 JavaScript / TypeScript</text>
      <text x="445" y="14" class="lg-pct" text-anchor="end">38%</text>
      <rect y="22" width="445" height="8" rx="4" fill="#1f1a3a"/>
      <rect y="22" width="0" height="8" rx="4" fill="#f7df1e">
        <animate attributeName="width" from="0" to="169" dur="1.4s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(0, 36)">
      <text x="0" y="14" class="lg-name">⚛️ React &amp; Ecosystem</text>
      <text x="445" y="14" class="lg-pct" text-anchor="end">26%</text>
      <rect y="22" width="445" height="8" rx="4" fill="#1f1a3a"/>
      <rect y="22" width="0" height="8" rx="4" fill="#61dafb">
        <animate attributeName="width" from="0" to="115" dur="1.6s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="14" class="lg-name">🟢 Node.js &amp; Backend</text>
      <text x="445" y="14" class="lg-pct" text-anchor="end">18%</text>
      <rect y="22" width="445" height="8" rx="4" fill="#1f1a3a"/>
      <rect y="22" width="0" height="8" rx="4" fill="#68a063">
        <animate attributeName="width" from="0" to="80" dur="1.8s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(0, 108)">
      <text x="0" y="14" class="lg-name">💙 Dart / Flutter</text>
      <text x="445" y="14" class="lg-pct" text-anchor="end">12%</text>
      <rect y="22" width="445" height="8" rx="4" fill="#1f1a3a"/>
      <rect y="22" width="0" height="8" rx="4" fill="#02569b">
        <animate attributeName="width" from="0" to="53" dur="2.0s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(0, 144)">
      <text x="0" y="14" class="lg-name">🍃 MongoDB &amp; Firebase</text>
      <text x="445" y="14" class="lg-pct" text-anchor="end">6%</text>
      <rect y="22" width="445" height="8" rx="4" fill="#1f1a3a"/>
      <rect y="22" width="0" height="8" rx="4" fill="#ffca28">
        <animate attributeName="width" from="0" to="28" dur="2.2s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>